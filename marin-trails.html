<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marin Trails — your map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #ECE7D6;
    --forest: #24382C;
    --bay: #3D6C82;
    --sage: #7C8F6E;
    --poppy: #C1542E;
    --ink: #171F16;
    --card: #FBF9F1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Public Sans', sans-serif;
    color: var(--ink);
    background: var(--sand);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }

  .leaflet-tile-pane { filter: saturate(0.85) sepia(0.08); }

  .brand {
    position: absolute; top: 18px; left: 18px; z-index: 500;
    background: var(--card);
    border-radius: 14px;
    padding: 10px 18px;
    box-shadow: 0 2px 14px rgba(23,31,22,0.15);
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    color: var(--forest);
    letter-spacing: 0.2px;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--sage);
  }
  .legend {
    display: flex; gap: 10px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(23,31,22,0.08);
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; color: var(--ink);
    cursor: pointer;
    padding: 3px 7px;
    border-radius: 999px;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .legend-item:hover { background: rgba(23,31,22,0.06); }
  .legend-item:not(.active) { opacity: 0.35; }
  .legend i {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }

  .fav-counter {
    position: absolute; top: 18px; right: 18px; z-index: 500;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--forest);
    box-shadow: 0 2px 14px rgba(23,31,22,0.15);
    display: flex; align-items: center; gap: 6px;
  }
  .fav-counter svg { width: 14px; height: 14px; }

  /* Trailhead marker */
  .trailhead-icon {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .trailhead-icon svg {
    width: 16px; height: 16px;
    filter: drop-shadow(0 1px 2px rgba(23,31,22,0.25));
  }

  /* Popup card */
  /* Smooth hover easing on trail lines instead of an abrupt jump */
  .leaflet-interactive {
    transition: stroke-width 0.2s ease, opacity 0.2s ease;
  }

  /* Popup fade/scale-in — animated on the inner wrapper so it doesn't fight
     Leaflet's own positioning transform on .leaflet-popup itself */
  .leaflet-popup-content-wrapper {
    animation: popIn 0.16s ease-out;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(23,31,22,0.2);
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(4px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .leaflet-popup-tip { background: var(--card); }
  .leaflet-popup-content { margin: 14px 16px; width: 230px !important; }
  .leaflet-popup-close-button { color: var(--sage) !important; }

  .pop-name {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--forest);
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .pop-tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .token {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(61,108,130,0.12);
    color: var(--bay);
    white-space: nowrap;
  }
  .token.difficulty-Strenuous { background: rgba(193,84,46,0.14); color: var(--poppy); }
  .token.difficulty-Moderate { background: rgba(124,143,110,0.18); color: var(--forest); }
  .token.difficulty-Easy { background: rgba(61,108,130,0.12); color: var(--bay); }

  .pop-blurb {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .pop-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .btn-viewmore {
    font-family: 'Public Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--card);
    background: var(--forest);
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn-viewmore:hover { background: var(--ink); }
  .fav-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    transition: background 0.15s ease;
  }
  .fav-btn:hover { background: rgba(193,84,46,0.1); }
  .fav-btn svg { width: 19px; height: 19px; }

  /* Left sidebar (expanded view) */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 30vw; min-width: 340px; max-width: 460px;
    background: var(--card);
    box-shadow: 8px 0 32px rgba(23,31,22,0.22);
    z-index: 1000;
    display: flex; flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.34s cubic-bezier(0.22, 0.8, 0.36, 1);
  }
  .sidebar.open { transform: translateX(0); }

  .sheet-header {
    padding: 26px 28px 18px;
    border-bottom: 1px solid rgba(23,31,22,0.08);
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-shrink: 0;
  }
  .sheet-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 25px;
    font-weight: 600;
    color: var(--forest);
    margin: 0 0 4px;
    line-height: 1.15;
  }
  .sheet-header .loc {
    font-size: 12.5px;
    color: var(--sage);
    font-weight: 600;
  }
  .sheet-close {
    background: rgba(23,31,22,0.06);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sheet-close:hover { background: rgba(23,31,22,0.12); }
  .sheet-close svg { width: 14px; height: 14px; }

  .sheet-stats {
    display: flex; gap: 8px; padding: 16px 28px;
    border-bottom: 1px solid rgba(23,31,22,0.08);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .stat { min-width: 72px; }
  .stat .num {
    font-family: 'Fraunces', serif;
    font-size: 18px; font-weight: 600; color: var(--forest);
    line-height: 1.1;
  }
  .stat .lbl {
    font-size: 10.5px; color: var(--sage); font-weight: 600;
    margin-top: 2px;
  }

  .sheet-body {
    padding: 20px 28px 28px;
    overflow-y: auto;
    flex: 1;
  }
  .sheet-section { margin-bottom: 22px; }
  .sheet-section:last-child { margin-bottom: 0; }
  .sheet-section h3 {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--bay);
    margin: 0 0 8px;
  }
  .sheet-section p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0;
  }

  .skeleton {
    height: 14px; border-radius: 6px;
    background: linear-gradient(90deg, rgba(23,31,22,0.06), rgba(23,31,22,0.12), rgba(23,31,22,0.06));
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
    margin-bottom: 8px;
  }
  .skeleton:last-child { width: 70%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .sheet-footer {
    padding: 14px 28px;
    border-top: 1px solid rgba(23,31,22,0.08);
    display: flex; justify-content: flex-end;
    flex-shrink: 0;
  }
  .btn-fav-large {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Public Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--poppy);
    background: transparent;
    color: var(--poppy);
    cursor: pointer;
  }
  .btn-fav-large.active { background: var(--poppy); color: var(--card); }
  .btn-fav-large svg { width: 15px; height: 15px; }

  /* Weather block in sidebar */
  /* Directions chip */
  .directions-chip {
    display: flex; align-items: center; gap: 7px;
    margin: 14px 28px 0;
    padding: 8px 14px;
    background: rgba(61,108,130,0.09);
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    color: var(--bay);
    text-decoration: none;
    width: fit-content;
    max-width: calc(100% - 56px);
    transition: background 0.15s ease;
  }
  .directions-chip:hover { background: rgba(61,108,130,0.18); }
  .directions-chip svg { width: 13px; height: 13px; flex-shrink: 0; }
  .directions-chip span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .weather-card {
    display: flex; align-items: center; gap: 12px;
    background: rgba(61,108,130,0.08);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 18px 28px 0;
  }
  .weather-card .weather-glyph { width: 26px; height: 26px; flex-shrink: 0; }
  .weather-card .weather-glyph svg { width: 100%; height: 100%; }
  .weather-card .temp {
    font-family: 'Fraunces', serif;
    font-size: 22px; font-weight: 600; color: var(--bay);
    line-height: 1;
  }
  .weather-card .details { flex: 1; }
  .weather-card .cond { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .weather-card .sub { font-size: 11px; color: var(--sage); margin-top: 2px; }
  .weather-card .skeleton { margin: 0; width: 100%; }

  /* Add-trail button + draw mode UI */
  .add-trail-btn {
    width: 100%;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid rgba(23,31,22,0.08);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: none; border: none;
    font-family: 'Public Sans', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--forest);
    cursor: pointer;
  }
  .add-trail-btn:hover { color: var(--poppy); }
  .add-trail-btn svg { width: 14px; height: 14px; }
  .add-trail-btn.active { color: var(--poppy); }

  .draw-banner {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%) translateY(-140%);
    z-index: 600;
    background: var(--forest); color: var(--card);
    border-radius: 999px;
    padding: 10px 10px 10px 18px;
    display: flex; align-items: center; gap: 12px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(23,31,22,0.3);
    transition: transform 0.28s ease;
    max-width: 90vw;
  }
  .draw-banner.visible { transform: translateX(-50%) translateY(0); }
  .draw-banner button {
    background: rgba(251,249,241,0.15);
    border: none; color: var(--card);
    font-size: 11.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px;
    cursor: pointer; flex-shrink: 0;
  }
  .draw-banner button:hover { background: rgba(251,249,241,0.28); }

  .done-drawing-btn {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(200%);
    z-index: 600;
    background: var(--poppy); color: var(--card);
    border: none; border-radius: 999px;
    padding: 12px 22px;
    font-family: 'Public Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(193,84,46,0.4);
    cursor: pointer;
    transition: transform 0.28s ease;
  }
  .done-drawing-btn.visible { transform: translateX(-50%) translateY(0); }

  #map.drawing-mode { cursor: crosshair; }

  /* Sidebar create/edit form */
  .sidebar-form { display: none; flex-direction: column; height: 100%; }
  .sidebar-form.active { display: flex; }
  .sidebar-view.hidden { display: none; }

  .form-field { margin-bottom: 18px; }
  .form-field label {
    display: block; font-size: 11.5px; font-weight: 700;
    color: var(--bay); margin-bottom: 6px;
  }
  .form-field input, .form-field textarea {
    width: 100%; border: 1.5px solid rgba(23,31,22,0.12);
    border-radius: 10px; padding: 10px 12px;
    font-family: 'Public Sans', sans-serif; font-size: 14px;
    color: var(--ink); background: var(--sand);
    resize: none;
  }
  .form-field input:focus, .form-field textarea:focus {
    outline: none; border-color: var(--bay);
  }
  .difficulty-picker { display: flex; gap: 8px; }
  .diff-swatch {
    flex: 1; padding: 10px 4px;
    border-radius: 10px; border: 1.5px solid rgba(23,31,22,0.12);
    background: var(--sand);
    font-family: 'Public Sans', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .diff-swatch::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: var(--swatch);
  }
  .diff-swatch.selected { border-color: var(--swatch); background: color-mix(in srgb, var(--swatch) 12%, var(--sand)); }
  .form-delete-btn {
    width: 100%; padding: 10px; border-radius: 10px;
    border: 1.5px solid rgba(193,84,46,0.4);
    background: none; color: var(--poppy);
    font-family: 'Public Sans', sans-serif; font-size: 12.5px; font-weight: 700;
    cursor: pointer;
  }
  .form-delete-btn:hover { background: rgba(193,84,46,0.08); }

  .attribution-note {
    position: absolute; bottom: 8px; right: 8px; z-index: 400;
    font-size: 10px; color: var(--sage); background: rgba(251,249,241,0.7);
    padding: 2px 6px; border-radius: 6px;
  }

  /* Camera markers */
  .camera-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .camera-icon svg { width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(23,31,22,0.3)); }
  .camera-popup-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: var(--forest); margin: 0 0 4px; }
  .camera-popup-note { font-size: 11.5px; color: var(--sage); margin: 0 0 10px; line-height: 1.4; }
  a.camera-popup-link {
    display: inline-block;
    font-size: 12px; font-weight: 700;
    color: #FFFFFF !important;
    background: var(--forest);
    border-radius: 999px; padding: 6px 12px;
    text-decoration: none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="brand">
  <h1>your map</h1>
  <p>Marin County · runs & hikes</p>
  <div class="legend" id="legend">
    <span class="legend-item active" data-difficulty="Easy"><i style="background:#7C8F6E"></i>Easy</span>
    <span class="legend-item active" data-difficulty="Moderate"><i style="background:#3D6C82"></i>Moderate</span>
    <span class="legend-item active" data-difficulty="Strenuous"><i style="background:#24382C"></i>Strenuous</span>
  </div>
  <button class="add-trail-btn" id="addTrailBtn" title="Add a trail">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Add trail
  </button>
</div>

<div class="draw-banner" id="drawBanner">
  <span id="drawBannerText">Tap the map to place your trailhead.</span>
  <button id="undoDrawBtn" style="display:none;">Undo</button>
  <button id="cancelDrawBtn">Cancel</button>
</div>

<button class="done-drawing-btn" id="doneDrawingBtn">Done — name this route</button>

<div class="fav-counter" id="favCounter">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.5 2 4.8 5.6 4.1c2-.4 4 .5 5.1 2.2C11.8 4.6 13.8 3.7 15.8 4.1c3.6.7 5.2 4.4 3.6 7.7C16.9 16.4 12 21 12 21z" fill="#C1542E" stroke="#C1542E" stroke-width="1.2"/></svg>
  <span id="favCount">0</span> favorited
</div>

<div class="attribution-note">Map data © OpenStreetMap contributors</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-view" id="sidebarView">
    <div class="sheet-header">
      <div>
        <h2 id="sheetName">Trail name</h2>
        <div class="loc" id="sheetLoc">Marin County, CA</div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="sheet-close" id="sheetEditBtn" title="Edit this trail" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" stroke="#171F16" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="sheet-close" id="sheetClose">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#171F16" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="sheet-stats" id="sheetStats"></div>
    <a class="directions-chip" id="directionsChip" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l17-8-8 17-2-7-7-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span id="directionsAddress">Address</span>
    </a>
    <div class="weather-card" id="weatherCard">
      <div class="skeleton"></div>
    </div>
    <div class="sheet-body" id="sheetBody">
      <div class="sheet-section">
        <h3>History</h3>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <div class="sheet-section">
        <h3>Recent on the trail</h3>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <div class="sheet-section">
        <h3>What people are saying</h3>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-fav-large" id="sheetFavBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.5 2 4.8 5.6 4.1c2-.4 4 .5 5.1 2.2C11.8 4.6 13.8 3.7 15.8 4.1c3.6.7 5.2 4.4 3.6 7.7C16.9 16.4 12 21 12 21z" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="favBtnLabel">Save route</span>
      </button>
    </div>
  </div>

  <div class="sidebar-form" id="sidebarForm">
    <div class="sheet-header">
      <div>
        <h2 id="formTitle">Name your route</h2>
        <div class="loc" id="formDistance">0.0 mi traced</div>
        <div class="loc" id="formLocation" style="margin-top:2px;">Locating…</div>
      </div>
      <button class="sheet-close" id="formCloseBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#171F16" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="form-field">
        <label>Name</label>
        <input type="text" id="formName" placeholder="e.g. My morning loop" maxlength="60">
      </div>
      <div class="form-field">
        <label>Difficulty</label>
        <div class="difficulty-picker" id="difficultyPicker">
          <button type="button" class="diff-swatch" data-difficulty="Easy" style="--swatch:#7C8F6E">Easy</button>
          <button type="button" class="diff-swatch" data-difficulty="Moderate" style="--swatch:#3D6C82">Moderate</button>
          <button type="button" class="diff-swatch" data-difficulty="Strenuous" style="--swatch:#24382C">Strenuous</button>
        </div>
      </div>
      <div class="form-field">
        <label>Notes (optional)</label>
        <textarea id="formBlurb" rows="3" maxlength="160" placeholder="What makes this route worth coming back to?"></textarea>
      </div>
      <div class="form-field" id="formDeleteWrap" style="display:none;">
        <button type="button" class="form-delete-btn" id="formDeleteBtn">Delete this route</button>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-fav-large active" id="formSaveBtn" style="border-color:#24382C; background:#24382C;">Save route</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- REAL TRAIL DATA (Marin County) ----------
// Coordinates are real trailhead/landmark locations; route lines between them
// are simplified approximations (not precise GPS traces), built from public
// trail descriptions rather than fabricated. Stats sourced from public trail info.
function colorForDifficulty(difficulty) {
  if (difficulty === 'Easy') return '#7C8F6E';       // sage — lighter, easier
  if (difficulty === 'Moderate') return '#3D6C82';   // bay — mid
  return '#24382C';                                   // forest — strenuous, heaviest
}

const trails = [
  {
    id: 'dipsea',
    address: '352 Throckmorton Ave, Mill Valley, CA 94941',
    osmQuery: 'Dipsea',
    name: 'Dipsea Trail',
    difficulty: 'Strenuous',
    distance: '7.4 mi',
    elevation: '2,200 ft gain',
    blurb: 'The legendary Mill Valley–to–Stinson Beach classic, and the oldest trail race route in the country.',
    trailhead: [37.9060, -122.5449],
    path: [
      [37.9060, -122.5449], // Old Mill Park, Mill Valley

function iconSvg(favorited, color, isCustom) {
  const stroke = favorited ? '#C1542E' : color;
  const fill = favorited ? '#C1542E' : (isCustom ? 'none' : '#FBF9F1');
  const strokeWidth = (isCustom && !favorited) ? 2.4 : 2;
  return `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}"/></svg>`;
}

function heartIcon(active) {
  return `<svg viewBox="0 0 24 24" fill="${active ? 'currentColor' : 'none'}"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.5 2 4.8 5.6 4.1c2-.4 4 .5 5.1 2.2C11.8 4.6 13.8 3.7 15.8 4.1c3.6.7 5.2 4.4 3.6 7.7C16.9 16.4 12 21 12 21z" stroke="currentColor" stroke-width="1.6"/></svg>`;
}

const trailLayers = {}; // trailId -> { lines: [...], halos: [...] }
const markerRefs = {};

// Note: a live OpenStreetMap (Overpass API) fetch was attempted here for real
// trail geometry, but this artifact sandbox blocks cross-origin requests to
// third-party APIs outside Anthropic's own — only api.anthropic.com and
// api.weather.gov are reachable from here. Pulling real GPX/OSM geometry is
// very doable, just not from inside this sandboxed environment — see Claude
// Code for that next step. Using the hand-placed paths directly for now.

let closePopupTimer = null;
function cancelClosePopup() {
  if (closePopupTimer) { clearTimeout(closePopupTimer); closePopupTimer = null; }
}
function scheduleClosePopup() {
  cancelClosePopup();
  closePopupTimer = setTimeout(() => { map.closePopup(); }, 150);
}

function attachSegmentHandlers(halo, line, trail, baseWeight) {
  line.on('mouseover', () => { cancelClosePopup(); line.setStyle({ weight: baseWeight + 1.5 }); openPopup(trail); });
  line.on('mouseout', () => {
    line.setStyle({ weight: favorites.has(trail.id) ? baseWeight + 0.5 : baseWeight });
    scheduleClosePopup();
  });
  line.on('click', () => openSidebar(trail));
  halo.on('mouseover', () => { cancelClosePopup(); openPopup(trail); });
  halo.on('mouseout', () => scheduleClosePopup());
  halo.on('click', () => openSidebar(trail));
}

function drawIn(path, delayMs) {
  const el = path.getElement();
  if (!el || typeof el.getTotalLength !== 'function') return;
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
  el.style.transition = 'none';
  // Force layout, then animate after the stagger delay
  requestAnimationFrame(() => {
    setTimeout(() => {
      el.style.transition = 'stroke-dashoffset 0.9s ease, stroke-width 0.2s ease, opacity 0.2s ease';
      el.style.strokeDashoffset = '0';
      // Once drawn in, remove the dash pattern entirely. Leaflet reprojects
      // this path's geometry on every zoom/pan, which changes its actual
      // pixel length — a fixed dasharray from the original length would then
      // mismatch the new length and render as broken/dashed segments.
      setTimeout(() => {
        el.style.strokeDasharray = 'none';
        el.style.strokeDashoffset = '0';
      }, 950);
    }, delayMs);
  });
}

function renderTrail(trail, index) {
  const baseWeight = 3;
  const halo = L.polyline(trail.path, {
    color: '#FBF9F1', weight: baseWeight + 3, opacity: 0.85, lineCap: 'round', lineJoin: 'round'
  }).addTo(map);
  const line = L.polyline(trail.path, {
    color: trail.color, weight: baseWeight, opacity: 0.95, lineCap: 'round', lineJoin: 'round'
  }).addTo(map);
  attachSegmentHandlers(halo, line, trail, baseWeight);
  trailLayers[trail.id] = { lines: [line], halos: [halo] };

  const delay = index * 180;
  drawIn(halo, delay);
  drawIn(line, delay);

  const icon = L.divIcon({
    className: 'trailhead-icon',
    html: iconSvg(favorites.has(trail.id), trail.color, trail.isCustom),
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  });
  const marker = L.marker(trail.trailhead, { icon }).addTo(map);
  markerRefs[trail.id] = marker;
  marker.on('mouseover', () => { cancelClosePopup(); openPopup(trail); });
  marker.on('mouseout', () => scheduleClosePopup());
  marker.on('click', () => openSidebar(trail));
}

trails.forEach((trail, index) => { renderTrail(trail, index); });

// Difficulty filter, driven by the legend
const activeDifficulties = new Set(['Easy', 'Moderate', 'Strenuous']);

function applyDifficultyFilter() {
  trails.forEach(trail => {
    const visible = activeDifficulties.has(trail.difficulty);
    const layers = trailLayers[trail.id];
    const targets = layers ? [...layers.lines, ...layers.halos] : [];
    targets.forEach(layer => {
      if (visible && !map.hasLayer(layer)) layer.addTo(map);
      if (!visible && map.hasLayer(layer)) map.removeLayer(layer);
    });
    const marker = markerRefs[trail.id];
    if (marker) {
      if (visible && !map.hasLayer(marker)) marker.addTo(map);
      if (!visible && map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
}

document.querySelectorAll('.legend-item').forEach(item => {
  item.addEventListener('click', () => {
    const difficulty = item.dataset.difficulty;
    if (activeDifficulties.has(difficulty)) {
      activeDifficulties.delete(difficulty);
      item.classList.remove('active');
    } else {
      activeDifficulties.add(difficulty);
      item.classList.add('active');
    }
    map.closePopup();
    applyDifficultyFilter();
  });
});

function refreshFavoriteVisuals(trailId) {
  const isFav = favorites.has(trailId);
  const trail = trails.find(t => t.id === trailId);
  const layers = trailLayers[trailId];
  if (layers) {
    layers.lines.forEach(line => {
      const base = 3;
      line.setStyle({ opacity: 1, weight: isFav ? base + 1 : base });
      const el = line.getElement();
      if (el) {
        if (isFav) el.style.setProperty('filter', 'drop-shadow(0 0 5px rgba(193,84,46,0.65))');
        else el.style.removeProperty('filter');
      }
    });
  }
  markerRefs[trailId].setIcon(L.divIcon({
    className: 'trailhead-icon' + (isFav ? ' favorited' : ''),
    html: iconSvg(isFav, trail.color, trail.isCustom),
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  }));
  updateFavCounter();
}

function toggleFavorite(trailId) {
  if (favorites.has(trailId)) favorites.delete(trailId);
  else favorites.add(trailId);
  refreshFavoriteVisuals(trailId);
}

function openPopup(trail) {
  const isFav = favorites.has(trail.id);
  const content = document.createElement('div');
  content.innerHTML = `
    <div class="pop-name">${trail.name}</div>
    <div class="pop-tokens">
      <span class="token difficulty-${trail.difficulty}">${trail.difficulty}</span>
      <span class="token">${trail.distance}</span>
      <span class="token">${trail.elevation}</span>
    </div>
    <p class="pop-blurb">${trail.blurb}</p>
    <div class="pop-actions">
      <button class="btn-viewmore">View more</button>
      <button class="fav-btn" title="Save route">${heartIcon(isFav)}</button>
    </div>
  `;
  content.querySelector('.fav-btn').style.color = isFav ? '#C1542E' : '#7C8F6E';
  content.querySelector('.btn-viewmore').addEventListener('click', () => {
    map.closePopup();
    openSidebar(trail);
  });
  content.querySelector('.fav-btn').addEventListener('click', (e) => {
    toggleFavorite(trail.id);
    e.currentTarget.innerHTML = heartIcon(favorites.has(trail.id));
    e.currentTarget.style.color = favorites.has(trail.id) ? '#C1542E' : '#7C8F6E';
  });

  const existing = map._popup;
  if (existing && existing.trailId === trail.id && map.hasLayer(existing)) return;

  const popup = L.popup({ closeButton: true, className: 'trail-popup', autoPan: false })
    .setLatLng(trail.trailhead)
    .setContent(content)
    .openOn(map);
  popup.trailId = trail.id;

  const popupEl = popup.getElement();
  if (popupEl) {
    popupEl.addEventListener('mouseenter', cancelClosePopup);
    popupEl.addEventListener('mouseleave', scheduleClosePopup);
  }
}

  sheetFavBtn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
}

sheetFavBtn.addEventListener('click', () => {
  if (!currentTrail) return;
  toggleFavorite(currentTrail.id);
  renderFavButton(currentTrail);
});

function renderSkeleton() {
  sheetBody.innerHTML = `
    <div class="sheet-section"><h3>History</h3><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="sheet-section"><h3>Recent on the trail</h3><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="sheet-section"><h3>What people are saying</h3><div class="skeleton"></div><div class="skeleton"></div></div>
  `;
}

function renderInsights(data) {
  sheetBody.innerHTML = `
    <div class="sheet-section"><h3>History</h3><p>${data.history}</p></div>
    <div class="sheet-section"><h3>Recent on the trail</h3><p>${data.recentNotes}</p></div>

  `;
}

// National Weather Service — free, no API key. Two-step lookup:
// resolve lat/lon to a forecast office grid, then pull the current period.
async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { signal: controller.signal });
  } finally {
    clearTimeout(timeout);
  }
}

async function fetchWeather(coord) {
  const [lat, lon] = coord;
  const pointsRes = await fetchWithTimeout(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`, 10000);
  if (!pointsRes.ok) throw new Error('NWS points lookup failed');
  const pointsData = await pointsRes.json();
  const forecastUrl = pointsData.properties.forecast;
  const forecastRes = await fetchWithTimeout(forecastUrl, 10000);
  if (!forecastRes.ok) throw new Error('NWS forecast fetch failed');
  const forecastData = await forecastRes.json();
  return forecastData.properties.periods[0]; // current/next period
}

function weatherGlyph(shortForecast) {
  const f = (shortForecast || '').toLowerCase();
  if (f.includes('fog') || f.includes('haze')) {
    return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 10h16M3 14h18M5 18h14" stroke="#3D6C82" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="7" r="3" stroke="#3D6C82" stroke-width="1.4"/></svg>`;
  }
  if (f.includes('rain') || f.includes('shower') || f.includes('drizzle')) {
    return `<svg viewBox="0 0 24 24" fill="none"><path d="M7 10a4 4 0 01.4-8 5 5 0 019.2 1.4A4.5 4.5 0 0117 10H7z" stroke="#3D6C82" stroke-width="1.5"/><path d="M8 14l-1.5 3M12 14l-1.5 3M16 14l-1.5 3" stroke="#3D6C82" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  }
  if (f.includes('cloud') || f.includes('overcast')) {
    return `<svg viewBox="0 0 24 24" fill="none"><path d="M7 17a4 4 0 01.4-8 5 5 0 019.2 1.4A4.5 4.5 0 0117 17H7z" stroke="#3D6C82" stroke-width="1.6"/></svg>`;
  }
  // clear / sunny default
  return `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="#C1542E" stroke-width="1.6"/><path d="M12 3v2.5M12 18.5V21M4.2 12H6.7M17.3 12h2.5M6.3 6.3l1.8 1.8M15.9 15.9l1.8 1.8M17.7 6.3l-1.8 1.8M8.1 15.9l-1.8 1.8" stroke="#C1542E" stroke-width="1.4" stroke-linecap="round"/></svg>`;
}

function renderWeather(period) {
  const card = document.getElementById('weatherCard');
  card.innerHTML = `
    <div class="weather-glyph">${weatherGlyph(period.shortForecast)}</div>
    <div class="temp">${period.temperature}°</div>
    <div class="details">
      <div class="cond">${period.shortForecast}</div>
      <div class="sub">${period.name} · Wind ${period.windSpeed} ${period.windDirection}</div>
    </div>
  `;
}

function renderWeatherError() {
  const card = document.getElementById('weatherCard');
  card.innerHTML = `<div class="sub">Weather data unavailable right now — check back before you head out.</div>`;
}

// Best-effort reverse-lookup for a custom route's starting point, using the
// same Anthropic API access already proven reliable for trail insights.
// Elevation is deliberately NOT estimated this way — a real elevation gain
// needs actual terrain data (a DEM/elevation API), which this sandbox can't
// reach, so a custom route's elevation stays honestly labeled "Not measured"
// rather than guessed at.
let pendingLocationLabel = null;

async function fetchRouteLocationLabel(startPoint) {
  pendingLocationLabel = null;
  const [lat, lon] = startPoint;
  const prompt = `A hiking/running app needs a short, human-readable location label for a route starting at latitude ${lat.toFixed(5)}, longitude ${lon.toFixed(5)} in Marin County, California. Respond with ONLY the label itself — under 8 words, e.g. "Near Muir Woods, Mill Valley, CA" — no explanation, no punctuation besides commas, nothing else.`;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 60,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    if (!response.ok) throw new Error('Location lookup failed: ' + response.status);
    const data = await response.json();
    const text = data.content.filter(b => b.type === "text").map(b => b.text).join(" ").trim();
    if (text) {
      pendingLocationLabel = text.replace(/^["']|["']$/g, '').slice(0, 80);
      const formLocationEl = document.getElementById('formLocation');
      if (formLocationEl && sidebarForm.classList.contains('active')) {
        formLocationEl.textContent = pendingLocationLabel;
      }
    }
  } catch (err) {
    console.warn('Route location lookup failed, using generic fallback:', err);
    pendingLocationLabel = 'Marin County, CA';
    const formLocationEl = document.getElementById('formLocation');
    if (formLocationEl && sidebarForm.classList.contains('active')) {
      formLocationEl.textContent = pendingLocationLabel;
    }
  } finally {
    clearTimeout(timeout);
  }
}

async function fetchInsights(trail) {
  const prompt = `Give me an in-depth, trustworthy profile of "${trail.name}" in Marin County, California, for a hiking/running app. Respond ONLY with raw JSON (no markdown fences, no preamble, no explanation before or after) with exactly these keys: "history" (2-3 sentences on real, verifiable history or origin of the trail), "recentNotes" (2-3 sentences on genuinely useful current/seasonal info a hiker would want, e.g. conditions, access, timing), "communitySentiment" (2-3 sentences synthesizing what hikers commonly and recently say about this specific trail, in your own words, no fabricated quotes). Be concise and only include what you're confident is accurate; omit anything you're unsure about rather than guess. Your entire response must be valid JSON and nothing else.`;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  let response;
  try {
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
  } finally {
    clearTimeout(timeout);
  }

  if (!response.ok) throw new Error('Anthropic API error: ' + response.status);
  const data = await response.json();
  if (!data.content || !Array.isArray(data.content)) throw new Error('Unexpected API response shape');

  const text = data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
  // Extract the first {...} block in case the model adds any stray text
  // despite instructions, rather than assuming the whole string is clean JSON.
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('No JSON object found in response');
  const parsed = JSON.parse(match[0]);

  if (!parsed.history || !parsed.recentNotes || !parsed.communitySentiment) {
    throw new Error('Response missing expected keys');
  }
  return parsed;
}

const genericFallback = {
  history: "This is a route you added yourself, so there's no third-party history to pull — but it's part of your map now.",
  recentNotes: "Since this route isn't in public trail databases, conditions and access details aren't available here yet — go by your own knowledge of the area.",
  communitySentiment: "No outside reviews exist for a personal route like this one — it's yours."
};

async function openSidebar(trail) {
  currentTrail = trail;
  sidebarForm.classList.remove('active');
  sidebarView.classList.remove('hidden');
  sheetName.textContent = trail.name;
  renderStats(trail);
  renderFavButton(trail);
  renderSkeleton();
  document.getElementById('weatherCard').innerHTML = '<div class="skeleton"></div>';

  document.getElementById('sheetEditBtn').style.display = trail.isCustom ? 'flex' : 'none';

  const [lat, lon] = trail.trailhead;
  const chip = document.getElementById('directionsChip');
  if (trail.address) {
    chip.style.display = 'flex';
    chip.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
    document.getElementById('directionsAddress').textContent = trail.address;
  } else {
    chip.style.display = 'none';
  }

  sidebar.classList.add('open');

  fetchWeather(trail.trailhead)
    .then(period => { if (currentTrail && currentTrail.id === trail.id) renderWeather(period); })
    .catch(err => {
      console.error('Weather fetch failed:', err);
      if (currentTrail && currentTrail.id === trail.id) renderWeatherError();
    });

  try {
    const insights = await fetchInsights(trail);
    if (currentTrail && currentTrail.id === trail.id) renderInsights(insights);
  } catch (err) {
    console.error('Falling back to static insights:', err);
    if (currentTrail && currentTrail.id === trail.id) renderInsights(fallback[trail.id] || genericFallback);
  }
}

// ---------- Add / edit your own trails ----------
function haversineMiles(a, b) {
  const R = 3958.8; // miles
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]);
  const dLon = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function pathDistanceMiles(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++) total += haversineMiles(path[i - 1], path[i]);
  return total;
}

const addTrailBtn = document.getElementById('addTrailBtn');
const drawBanner = document.getElementById('drawBanner');
const drawBannerText = document.getElementById('drawBannerText');
const doneDrawingBtn = document.getElementById('doneDrawingBtn');
const undoDrawBtn = document.getElementById('undoDrawBtn');
const mapEl = document.getElementById('map');

let drawMode = false;
let drawPoints = [];
let drawLine = null, drawHalo = null;
let drawPointMarkers = [];
let editingTrail = null; // set when the form is editing an existing custom trail

function updateDrawBannerText(snapped) {
  if (snapped) {
    drawBannerText.textContent = 'Snapped to a nearby trail.';
    return;
  }
  if (drawPoints.length === 0) drawBannerText.textContent = 'Tap the map to place your trailhead.';
  else if (drawPoints.length === 1) drawBannerText.textContent = 'Trailhead placed — tap again to add your next point.';
  else drawBannerText.textContent = 'Keep tapping to trace your route, or tap Done when finished.';
}

function redrawDrawPreview() {
  if (drawLine) { map.removeLayer(drawLine); map.removeLayer(drawHalo); drawLine = null; drawHalo = null; }
  drawPointMarkers.forEach(m => map.removeLayer(m));
  drawPointMarkers = [];
  if (drawPoints.length === 0) return;

  if (drawPoints.length > 1) {
    drawHalo = L.polyline(drawPoints, { color: '#FBF9F1', weight: 6, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
    drawLine = L.polyline(drawPoints, { color: '#C1542E', weight: 3, opacity: 0.95, lineCap: 'round', lineJoin: 'round', dashArray: '1,8' }).addTo(map);
  }
  drawPoints.forEach((pt, i) => {
    const isStart = i === 0;
    const marker = L.circleMarker(pt, {
      radius: isStart ? 6 : 4,
      color: '#C1542E', weight: 2,
      fillColor: isStart ? '#C1542E' : '#FBF9F1',
      fillOpacity: 1
    }).addTo(map);
    drawPointMarkers.push(marker);
  });
}

// ----- Snap new points to nearby existing trails, so a personal route can
// deliberately follow or branch off a real one -----
function closestPointOnSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const lengthSq = dx * dx + dy * dy;
  if (lengthSq === 0) return a;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + t * dx, y: a.y + t * dy };
}

function findSnapPoint(clickLatLng) {
  const SNAP_PX = 16;
  const clickPt = map.latLngToContainerPoint(clickLatLng);
  let best = null;
  let bestDist = Infinity;
  trails.forEach(trail => {
    if (editingTrail && trail.id === editingTrail.id) return;
    const path = trail.path;
    for (let i = 1; i < path.length; i++) {
      const a = map.latLngToContainerPoint(L.latLng(path[i - 1][0], path[i - 1][1]));
      const b = map.latLngToContainerPoint(L.latLng(path[i][0], path[i][1]));
      const c = closestPointOnSegment(clickPt, a, b);
      const dist = Math.hypot(c.x - clickPt.x, c.y - clickPt.y);
      if (dist < bestDist) { bestDist = dist; best = c; }
    }
  });
  if (best && bestDist <= SNAP_PX) {
    return { latlng: map.containerPointToLatLng(best), snapped: true };
  }
  return { latlng: clickLatLng, snapped: false };
}

function handleDrawClick(e) {
  const { latlng, snapped } = findSnapPoint(e.latlng);
  drawPoints.push([latlng.lat, latlng.lng]);
  redrawDrawPreview();
  if (drawPoints.length >= 2) doneDrawingBtn.classList.add('visible');
  if (drawPoints.length >= 1) undoDrawBtn.style.display = 'inline-block';
  updateDrawBannerText(snapped);
  if (snapped) setTimeout(() => updateDrawBannerText(false), 1100);
}

function enterDrawMode() {
  drawMode = true;
  drawPoints = [];
  addTrailBtn.classList.add('active');
  mapEl.classList.add('drawing-mode');
  drawBanner.classList.add('visible');
  doneDrawingBtn.classList.remove('visible');
  undoDrawBtn.style.display = 'none';
  updateDrawBannerText(false);
  closeSidebarForce();
  map.on('click', handleDrawClick);
}

function closeSidebarForce() {
  sidebarForm.classList.remove('active');
  sidebar.classList.remove('open');
}

function exitDrawMode(discard) {
  drawMode = false;
  addTrailBtn.classList.remove('active');
  mapEl.classList.remove('drawing-mode');
  drawBanner.classList.remove('visible');
  doneDrawingBtn.classList.remove('visible');
  map.off('click', handleDrawClick);
  if (discard) {
    if (drawLine) { map.removeLayer(drawLine); map.removeLayer(drawHalo); drawLine = null; drawHalo = null; }
    drawPointMarkers.forEach(m => map.removeLayer(m));
    drawPointMarkers = [];
    drawPoints = [];
  }
}

addTrailBtn.addEventListener('click', () => {
  if (drawMode) { exitDrawMode(true); return; }
  enterDrawMode();
});
document.getElementById('cancelDrawBtn').addEventListener('click', () => exitDrawMode(true));
undoDrawBtn.addEventListener('click', () => {
  if (drawPoints.length === 0) return;
  drawPoints.pop();
  redrawDrawPreview();
  if (drawPoints.length < 2) doneDrawingBtn.classList.remove('visible');
  if (drawPoints.length === 0) undoDrawBtn.style.display = 'none';
  updateDrawBannerText(false);
});

doneDrawingBtn.addEventListener('click', () => {
  exitDrawMode(false); // keep the drawn points/preview visible while naming
  editingTrail = null;
  fetchRouteLocationLabel(drawPoints[0]);
  openTrailForm(drawPoints);
});


// ----- Create/edit form -----
const formName = document.getElementById('formName');
const formBlurb = document.getElementById('formBlurb');
const formDistance = document.getElementById('formDistance');
const formTitle = document.getElementById('formTitle');
const difficultyPicker = document.getElementById('difficultyPicker');
const formDeleteWrap = document.getElementById('formDeleteWrap');
let selectedDifficulty = null;

difficultyPicker.querySelectorAll('.diff-swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    difficultyPicker.querySelectorAll('.diff-swatch').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDifficulty = btn.dataset.difficulty;
  });
});

function openTrailForm(points, existingTrail) {
  sidebarView.classList.add('hidden');
  sidebarForm.classList.add('active');
  sidebar.classList.add('open');

  const dist = pathDistanceMiles(points);
  formDistance.textContent = `${dist.toFixed(1)} mi traced`;

  difficultyPicker.querySelectorAll('.diff-swatch').forEach(b => b.classList.remove('selected'));
  selectedDifficulty = null;

  if (existingTrail) {
    formTitle.textContent = 'Edit route';
    formName.value = existingTrail.name;
    formBlurb.value = existingTrail.blurb || '';
    const match = difficultyPicker.querySelector(`[data-difficulty="${existingTrail.difficulty}"]`);
    if (match) { match.classList.add('selected'); selectedDifficulty = existingTrail.difficulty; }
    formDeleteWrap.style.display = 'block';
    document.getElementById('formLocation').textContent = existingTrail.address || 'Marin County, CA';
  } else {
    formTitle.textContent = 'Name your route';
    formName.value = '';
    formBlurb.value = '';
    formDeleteWrap.style.display = 'none';
    document.getElementById('formLocation').textContent = 'Locating…';
  }
  formName.focus();
}

document.getElementById('formCloseBtn').addEventListener('click', () => {
  sidebarForm.classList.remove('active');
  sidebarView.classList.remove('hidden');
  sidebar.classList.remove('open');
  if (!editingTrail) exitDrawMode(true); // discard an unsaved new route
  editingTrail = null;
});

document.getElementById('formSaveBtn').addEventListener('click', () => {
  const name = formName.value.trim();
  if (!name || !selectedDifficulty) {
    formName.style.borderColor = name ? '' : '#C1542E';
    if (!selectedDifficulty) difficultyPicker.style.outline = '1.5px solid #C1542E';
    setTimeout(() => { difficultyPicker.style.outline = 'none'; }, 900);
    return;
  }

  if (editingTrail) {
    // Update in place — metadata only, path stays as originally drawn
    editingTrail.name = name;
    editingTrail.difficulty = selectedDifficulty;
    editingTrail.blurb = formBlurb.value.trim();
    editingTrail.color = colorForDifficulty(selectedDifficulty);
    const dist = pathDistanceMiles(editingTrail.path);
    editingTrail.distance = `${dist.toFixed(1)} mi`;
    editingTrail.stats = [
      [editingTrail.distance, 'Distance'],
      [editingTrail.elevation || 'Not measured', 'Elevation'],
      [editingTrail.difficulty, 'Difficulty'],
      ['You', 'Added by']
    ];
    trailLayers[editingTrail.id].lines.forEach(l => l.setStyle({ color: editingTrail.color }));
    refreshFavoriteVisuals(editingTrail.id);
    saveCustomTrailsToStorage();
    closeSidebarForce();
    sidebarView.classList.remove('hidden');
    openSidebar(editingTrail);
    editingTrail = null;
    return;
  }

  // Creating a new trail
  if (drawLine) { map.removeLayer(drawLine); map.removeLayer(drawHalo); drawLine = null; drawHalo = null; }
  drawPointMarkers.forEach(m => map.removeLayer(m));
  drawPointMarkers = [];

  const dist = pathDistanceMiles(drawPoints);
  const newTrail = {
    id: 'custom-' + Date.now(),
    name,
    difficulty: selectedDifficulty,
    color: colorForDifficulty(selectedDifficulty),
    distance: `${dist.toFixed(1)} mi`,
    elevation: 'Not measured',
    blurb: formBlurb.value.trim() || 'A route you traced yourself.',
    trailhead: drawPoints[0],
    path: drawPoints.slice(),
    address: pendingLocationLabel || 'Marin County, CA',
    isCustom: true,
    stats: [
      [`${dist.toFixed(1)} mi`, 'Distance'],
      ['Not measured', 'Elevation'],
      [selectedDifficulty, 'Difficulty'],
      ['You', 'Added by']
    ]
  };
  trails.push(newTrail);
  renderTrail(newTrail, trails.length - 1);
  applyDifficultyFilter();
  saveCustomTrailsToStorage();

  sidebarForm.classList.remove('active');
  sidebarView.classList.remove('hidden');
  drawPoints = [];
  openSidebar(newTrail);
});

document.getElementById('sheetEditBtn').addEventListener('click', () => {
  if (!currentTrail || !currentTrail.isCustom) return;
  editingTrail = currentTrail;
  openTrailForm(currentTrail.path, currentTrail);
});

document.getElementById('formDeleteBtn').addEventListener('click', () => {
  if (!editingTrail) return;
  const id = editingTrail.id;
  const layers = trailLayers[id];
  if (layers) {
    layers.lines.forEach(l => map.removeLayer(l));
    layers.halos.forEach(l => map.removeLayer(l));
    delete trailLayers[id];
  }
  if (markerRefs[id]) { map.removeLayer(markerRefs[id]); delete markerRefs[id]; }
  favorites.delete(id);
  const idx = trails.findIndex(t => t.id === id);
  if (idx !== -1) trails.splice(idx, 1);
  saveCustomTrailsToStorage();
  updateFavCounter();
  editingTrail = null;
  closeSidebarForce();
  sidebarView.classList.remove('hidden');
});

// ----- Personal storage: custom trails persist across visits -----
async function saveCustomTrailsToStorage() {
  const custom = trails.filter(t => t.isCustom).map(t => ({
    id: t.id, name: t.name, difficulty: t.difficulty, blurb: t.blurb,
    trailhead: t.trailhead, path: t.path, stats: t.stats,
    distance: t.distance, elevation: t.elevation, address: t.address || null
  }));
  try {
    await window.storage.set('custom-trails', JSON.stringify(custom), false);
  } catch (err) {
    console.warn('Could not save custom trails to storage:', err);
  }
}

async function loadCustomTrails() {
  try {
    const result = await window.storage.get('custom-trails', false);
    if (!result || !result.value) return;
    const custom = JSON.parse(result.value);
    custom.forEach((t, i) => {
      t.isCustom = true;
      t.color = colorForDifficulty(t.difficulty);
      trails.push(t);
      renderTrail(t, trails.length - 1);
    });
    applyDifficultyFilter();
  } catch (err) {
    console.warn('No saved custom trails yet, or failed to load:', err);
  }
}
loadCustomTrails();
